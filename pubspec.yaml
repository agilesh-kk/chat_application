name: chat_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  fpdart: ^1.2.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5
  supabase_flutter: ^2.12.0
  image_picker: ^1.2.1
  uuid: ^4.5.3
  timeago: ^3.7.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  dio: ^5.9.2
  scrollable_positioned_list: ^0.3.8
  hive: ^2.2.3
  http: ^1.6.0
  hive_flutter: ^1.1.0
  equatable: ^2.0.8
  rxdart: ^0.28.0
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.2.0
  firebase_database: ^12.3.0
  flutter_local_notifications: ^18.0.1
  flutter_shortcut_plus: ^1.0.1
  shared_preferences: ^2.5.3
  emoji_regex: ^0.0.5
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/profile_images/
    - assets/animations/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo1.png"
  adaptive_icon_background: "#FFFFFF" # or transparent
  adaptive_icon_foreground: "assets/logo/logo1.png"